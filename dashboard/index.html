<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Capsule - Telemetry Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #66fcf1;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background-color: #1f2833;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-top: 4px solid #45a29e;
            transition: all 0.3s ease;
        }
        .card.alert {
            border-top: 4px solid #ff4c4c;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { box-shadow: 0 0 10px rgba(255, 76, 76, 0.2); }
            to { box-shadow: 0 0 20px rgba(255, 76, 76, 0.6); }
        }
        .card h3 { margin: 0; color: #45a29e; font-size: 1.2rem; }
        .card.alert h3 { color: #ff4c4c; }
        .card .value { font-size: 2.5rem; font-weight: bold; margin: 10px 0; color: #fff; }
        .card .unit { font-size: 0.9rem; color: #888; }
        
        .chart-container {
            background-color: #1f2833;
            border-radius: 8px;
            padding: 20px;
            height: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        select {
            background-color: #0b0c10;
            color: #66fcf1;
            border: 1px solid #45a29e;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
        }
    </style>
</head>
<body>

    <h1>🚀 Dragon Capsule Telemetry</h1>

    <div class="grid-container">
        <div class="card" id="card-temp">
            <h3>Temperatura</h3>
            <div class="value" id="val-temp">--</div>
            <div class="unit">°C</div>
        </div>
        <div class="card" id="card-umid">
            <h3>Umidade</h3>
            <div class="value" id="val-umid">--</div>
            <div class="unit">%</div>
        </div>
        <div class="card" id="card-pres">
            <h3>Pressão</h3>
            <div class="value" id="val-pres">--</div>
            <div class="unit">hPa</div>
        </div>
        <div class="card" id="card-co2">
            <h3>Nível CO2</h3>
            <div class="value" id="val-co2">--</div>
            <div class="unit">ppm</div>
        </div>
        <div class="card" id="card-vel">
            <h3>Velocidade</h3>
            <div class="value" id="val-vel">--</div>
            <div class="unit">km/s</div>
        </div>
    </div>

    <div class="chart-container">
        <div class="header-controls">
            <h3 style="color: #66fcf1; margin:0;">Análise de Histórico</h3>
            <select id="attrSelector" onchange="fetchHistory()">
                <option value="t">Temperatura</option>
                <option value="h">Umidade</option>
                <option value="p">Pressão</option>
                <option value="c">CO2</option>
                <option value="v">Velocidade</option>
            </select>
        </div>
        <canvas id="historyChart"></canvas>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÕES DA SUA VM GOOGLE CLOUD
        // Substitua pelo IP externo atual da sua VM
        // ==========================================
        const IP_DA_VM = "35.199.64.218"; // Atualize este IP!
        
        const ORION_URL = `http://${IP_DA_VM}:1026/v2/entities/Capsule:dragon001`;
        const STH_URL_BASE = `http://${IP_DA_VM}:8666/STH/v1/contextEntities/type/Capsule/id/Capsule:dragon001/attributes/`;
        
        const HEADERS_FIWARE = {
            'fiware-service': 'smart',
            'fiware-servicepath': '/'
        };

        // Instância global do gráfico
        let myChart;

        // Limites para gatilho visual de alerta no dashboard (iguais ao C++)
        const LIMITS = {
            temp: { max: 30.0, min: 15.0 },
            pres: { max: 1040.0, min: 950.0 },
            co2: { max: 1500.0 },
            vel: { max: 8.5 }
        };

        // ==========================================
        // PARTE 1: TEMPO REAL (Busca no Orion)
        // ==========================================
        async function fetchRealTime() {
            try {
                const response = await fetch(ORION_URL, { headers: HEADERS_FIWARE });
                if (!response.ok) throw new Error('Falha Orion');
                
                const data = await response.json();

                // Extraindo valores (t, h, p, c, v são os nomes dos atributos no Orion)
                const t = parseFloat(data.t.value);
                const h = parseFloat(data.h.value);
                const p = parseFloat(data.p.value);
                const c = parseFloat(data.c.value);
                const v = parseFloat(data.v.value);

                // Atualizando HTML
                document.getElementById('val-temp').innerText = t.toFixed(1);
                document.getElementById('val-umid').innerText = h.toFixed(1);
                document.getElementById('val-pres').innerText = p.toFixed(1);
                document.getElementById('val-co2').innerText = c.toFixed(0);
                document.getElementById('val-vel').innerText = v.toFixed(2);

                // Lógica de Alertas Visuais
                toggleAlert('card-temp', (t > LIMITS.temp.max || t < LIMITS.temp.min));
                toggleAlert('card-pres', (p > LIMITS.pres.max || p < LIMITS.pres.min));
                toggleAlert('card-co2', (c > LIMITS.co2.max));
                toggleAlert('card-vel', (v > LIMITS.vel.max));

            } catch (error) {
                console.error("Erro ao buscar dados em tempo real:", error);
            }
        }

        function toggleAlert(cardId, isAlert) {
            const card = document.getElementById(cardId);
            if (isAlert) card.classList.add('alert');
            else card.classList.remove('alert');
        }

        // ==========================================
        // PARTE 2: HISTÓRICO (Busca no STH-Comet e Chart.js)
        // ==========================================
        async function fetchHistory() {
            const attr = document.getElementById('attrSelector').value;
            // Busca as últimas 20 leituras (?lastN=20)
            const sthUrl = `${STH_URL_BASE}${attr}?lastN=20`;

            try {
                const response = await fetch(sthUrl, { 
                    headers: { ...HEADERS_FIWARE, 'Accept': 'application/json' }
                });
                
                if (!response.ok) throw new Error('Falha STH-Comet');
                const data = await response.json();
                
                // O STH retorna um array 'values' dentro da estrutura
                const rawValues = data.contextResponses[0].contextElement.attributes[0].values;
                
                // Mapeia os dados para o formato do gráfico
                const labels = rawValues.map(item => new Date(item.recvTime).toLocaleTimeString('pt-BR'));
                const plotData = rawValues.map(item => parseFloat(item.attrValue));

                updateChart(labels, plotData, getLabelName(attr));

            } catch (error) {
                console.error("Erro ao buscar histórico:", error);
            }
        }

        function getLabelName(attrCode) {
            const map = { 't': 'Temperatura (°C)', 'h': 'Umidade (%)', 'p': 'Pressão (hPa)', 'c': 'CO2 (ppm)', 'v': 'Velocidade (km/s)' };
            return map[attrCode];
        }

        function updateChart(labels, data, datasetLabel) {
            const ctx = document.getElementById('historyChart').getContext('2d');
            
            // Destrói o gráfico antigo se existir para desenhar um novo (quando muda o select)
            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: datasetLabel,
                        data: data,
                        borderColor: '#45a29e',
                        backgroundColor: 'rgba(69, 162, 158, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4, // Suaviza a curva da linha
                        pointBackgroundColor: '#66fcf1'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#c5c6c7' } },
                        x: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#c5c6c7', maxRotation: 45, minRotation: 45 } }
                    },
                    plugins: {
                        legend: { labels: { color: '#c5c6c7' } }
                    }
                }
            });
        }

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        // Roda a primeira vez
        fetchRealTime();
        fetchHistory();

        // Configura o loop de atualização a cada 5 segundos
        setInterval(() => {
            fetchRealTime();
            fetchHistory();
        }, 5000);

    </script>
</body>
</html>
